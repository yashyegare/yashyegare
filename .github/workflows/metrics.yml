name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card 1: Overview stats (commits, PRs, issues, repos, storage, etc.)
      - name: Overview stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.stats.svg
          theme: transparent
          config_display: regular
          config_order: base.header, base.activity, base.community, base.metadata
          base: header, activity, community, metadata
          plugin_achievements: no

      # Card 2: Top languages
      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.languages.svg
          theme: transparent
          config_display: regular
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 25
          plugin_languages_analysis_timeout_repositories: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          plugin_languages_colors: github

      # Card 3: Contribution calendar with streaks
      - name: Calendar card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.calendar.svg
          theme: transparent
          config_display: regular
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 52
          plugin_calendar_streaks: yes
